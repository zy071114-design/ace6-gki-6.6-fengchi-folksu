name: Build Ace6 GKI 6.6 (fengchi + FinaSU)

# 一加 Ace 6 (PLQ110 / ossi / SM8750 "sun")
#   GKI 6.6 官方 ace_6 源码 + 风驰内核(HMBIRD/scx) + FinaSU(KernelSU, UAPI=6)
#
# FinaSU 是 FolkSU 原仓库 (github.com/LyraVoid/FinaSU) 改名后的新版本, v1.0.4 把
# KERNEL_SU_UAPI_VERSION 从 5 提到 6 -> 旧 FolkSU 内核会被管理器拒绝, 必须重编。

on:
  workflow_dispatch:
    inputs:
      apply_fengchi:
        description: '移植风驰内核 (HMBIRD/scx 调度器)'
        type: boolean
        default: true
      fengchi_patch_url:
        description: '机型专用风驰补丁 URL (留空=用仓库内 fengchi-ace6.patch; 如 Ace5 Pro 用 WildKernels oneplus/hmbird/fengchi_OP-ACE-5-PRO_A15.patch)'
        type: string
        default: ''
      susfs_ref:
        description: '可选: 锁定 susfs4ksu 的提交/分支 (留空=分支 HEAD)'
        type: string
        default: ''
      apply_susfs:
        description: '附加 SuSFS 隐藏补丁 (与 FinaSU 目录结构可能冲突)'
        type: boolean
        default: false
      apply_ksu:
        description: '内核内置 KernelSU (false = 配 init_boot 里的 kernelsu.ko LKM 使用)'
        type: boolean
        default: true
      apply_zram:
        description: 'zram 算法加强 (lz4/lz4hc/zstd/lzo/842 全后端 + writeback + multi-comp)'
        type: boolean
        default: false
      apply_net:
        description: '网络/TCP 增强 (BBR 等拥塞控制 + fq 队列 + ipset/xtables 扩展)'
        type: boolean
        default: false
      apply_bbg:
        description: 'BBG (Baseband-guard) 防格机 (往 CONFIG_LSM 追加 baseband_guard)'
        type: boolean
        default: false
      relax_vermagic:
        description: '通用GKI: 放宽 vendor 模块 vermagic 校验(只比对主版本号前缀), 让同平台其它机型/固件的模块也能加载'
        type: boolean
        default: false
      tcp_default_cong:
        description: '默认拥塞控制 (仅 apply_net=true 时生效; bbr 耗电/发热更高)'
        type: choice
        options: [cubic, bbr]
        default: cubic
      enable_btf:
        description: '生成 BTF (/sys/kernel/btf/vmlinux)。第三方 scx 调度器(CO-RE)必需, 需要 pahole'
        type: boolean
        default: false
      kernel_repo:
        description: '内核源码仓库 (完整厂商树才有原装风驰 HMBIRD)'
        type: string
        default: 'https://github.com/schqiushui/android_kernel_common_oneplus_sm8750.git'
      kernel_branch:
        description: '内核源码分支 (b_*=公开阉割版只有 sched_ext; v_*=完整厂商树自带 HMBIRD)'
        type: string
        default: 'oneplus/sm8750_v_16.0.0_ace_6'
      kernel_ref:
        description: '可选: 按提交号/标签构建 (留空=用分支头; 例: 5a398499aa 是 6.6.30 提交)'
        type: string
        default: ''
      device_tag:
        description: '机型短标识(产物/zip命名用, 如 ace6/op13/pad3)'
        type: string
        default: 'ace6'
      device_name:
        description: '机型显示名(安装界面/README 用)'
        type: string
        default: '一加 Ace 6'
      device_ids:
        description: '机型 ID(仅限提示用, 如 PLQ110/ossi/SM8750)'
        type: string
        default: 'PLQ110/ossi/SM8750'
      ksu_expected_version:
        description: 'FinaSU KSU_VERSION (须与管理器 APK 版本号一致; v1.0.4 = 32960)'
        type: string
        default: '32960'
      localversion:
        description: '内核版本后缀 (默认对齐出厂内核的完整版本串)'
        type: string
        default: '-android15-8-g9bc34d5b0c79-abogki537459655-4k'
      toolchain:
        description: '工具链: android = Android clang r510928 (出厂/参考/社区可用内核均用它); ubuntu = 发行版 clang-18'
        type: choice
        options: [android, ubuntu]
        default: android
      ksu_expected_size:
        description: 'FinaSU 管理器证书长度 (十六进制, v1.0.4 实测 0x2cc)'
        type: string
        default: '0x2cc'
      ksu_expected_hash:
        description: 'FinaSU 管理器证书 SHA-256 (v1.0.4 与旧 FolkSU 同一把密钥)'
        type: string
        default: '2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458'
      build_target:
        description: 'make 目标 (Image 最快, all 会连模块一起编)'
        type: string
        default: 'Image'
      use_ref_config:
        description: '用参考内核(实测可启动)的完整 .config 代替树的 gki_defconfig (configs/ref-6.6.150.config)'
        type: boolean
        default: false
      extra_config:
        description: '额外 CONFIG 覆盖 (空格分隔, 支持 =y/=m/=n/=数字/=字符串), 仅调试对照用'
        type: string
        default: ''

concurrency:
  group: ace6-gki-${{ github.ref }}-${{ github.event.inputs.device_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 释放磁盘空间
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/local/lib/node_modules
          sudo apt-get clean
          echo "=== after ==="; df -h /

      - name: 安装编译依赖
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev cpio zip unzip rsync kmod ccache \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            dwarves \
            python3 git wget curl xz-utils aria2
          if [ "${{ github.event.inputs.toolchain }}" = "ubuntu" ]; then
            wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 18 all
            sudo ln -sf "$(command -v clang-18)" /usr/local/bin/clang
            sudo ln -sf "$(command -v clang++-18)" /usr/local/bin/clang++ 2>/dev/null || true
            sudo ln -sf "$(command -v ld.lld-18)" /usr/local/bin/ld.lld
            for t in ar nm objcopy objdump readelf strip ranlib; do
              if [ -x "/usr/bin/llvm-$t-18" ]; then sudo ln -sf "/usr/bin/llvm-$t-18" "/usr/local/bin/llvm-$t"; fi
            done
          fi
          aarch64-linux-gnu-ld --version | head -1

      - name: 下载 Android clang r510928 工具链
        if: github.event.inputs.toolchain == 'android'
        run: |
          set -eux
          # 出厂内核/参考内核/cctv18 配方所用工具链: Android clang r510928 (18.0.0)
          # 依据: 三者 CFI/LTO/hardening 配置与本构建一致, 唯一差别是编译器实现;
          #       CONFIG_CFI_CLANG=y 时模块间接调用需匹配内核的 KCFI 类型哈希, 编译器必须同源。
          BASE='https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928'
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          aria2c -s16 -x16 -k1M "$BASE/clang-r510928.zip" -o clang.zip
          aria2c -s16 -x16 -k1M "$BASE/build-tools.zip" -o build-tools.zip
          mkdir -p clang18 build-tools
          unzip -q clang.zip -d clang18
          unzip -q build-tools.zip -d build-tools
          find . -maxdepth 3 -name clang -type f | head -5
          CLANG_BIN="$(dirname "$(find "$PWD/clang18" -maxdepth 3 -name clang -type f | head -n1)")"
          BT_BIN="$(find "$PWD/build-tools" -maxdepth 4 -type d -name bin | head -n1)"
          TOOLCHAIN_BIN="$CLANG_BIN"
          if [ -n "$BT_BIN" ]; then TOOLCHAIN_BIN="$TOOLCHAIN_BIN:$BT_BIN"; fi
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "clang bin: $CLANG_BIN  build-tools: ${BT_BIN:-none}"
          "$CLANG_BIN/clang" --version | head -2

      - name: 配置 ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ace6-gki-${{ github.event.inputs.localversion }}-${{ github.run_id }}
          restore-keys: |
            ace6-gki-${{ github.event.inputs.localversion }}-
            ace6-gki-
      - name: 启用 ccache
        run: |
          sudo mkdir -p /root/.ccache && sudo chmod 777 /root/.ccache || true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=5G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros,include_file_ctime,include_file_mtime" >> "$GITHUB_ENV"
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          ccache --version | head -1

      - name: 编译内核
        env:
          APPLY_FENGCHI: ${{ github.event.inputs.apply_fengchi == 'true' && '1' || '0' }}
          FENGCHI_PATCH_URL: ${{ github.event.inputs.fengchi_patch_url }}
          APPLY_SUSFS: ${{ github.event.inputs.apply_susfs == 'true' && '1' || '0' }}
          SUSFS_REF: ${{ github.event.inputs.susfs_ref }}
          APPLY_KSU: ${{ github.event.inputs.apply_ksu == 'true' && '1' || '0' }}
          APPLY_ZRAM: ${{ github.event.inputs.apply_zram == 'true' && '1' || '0' }}
          APPLY_NET: ${{ github.event.inputs.apply_net == 'true' && '1' || '0' }}
          APPLY_BBG: ${{ github.event.inputs.apply_bbg == 'true' && '1' || '0' }}
          TCP_DEFAULT_CONG: ${{ github.event.inputs.tcp_default_cong }}
          ENABLE_BTF: ${{ github.event.inputs.enable_btf == 'true' && '1' || '0' }}
          KERNEL_REPO: ${{ github.event.inputs.kernel_repo }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
          KERNEL_REF: ${{ github.event.inputs.kernel_ref }}
          KSU_EXPECTED_VERSION: ${{ github.event.inputs.ksu_expected_version }}
          LOCALVERSION_SUFFIX: ${{ github.event.inputs.localversion }}
          KSU_EXPECTED_SIZE: ${{ github.event.inputs.ksu_expected_size }}
          KSU_EXPECTED_HASH: ${{ github.event.inputs.ksu_expected_hash }}
          BUILD_TARGET: ${{ github.event.inputs.build_target }}
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
          USE_REF_CONFIG: ${{ github.event.inputs.use_ref_config == 'true' && '1' || '0' }}
          EXTRA_CONFIG: ${{ github.event.inputs.extra_config }}
          RELAX_VERMAGIC: ${{ github.event.inputs.relax_vermagic == 'true' && '1' || '0' }}
          INSTALL_DEPS: '0'
        run: |
          set -o pipefail
          if [ -n "${TOOLCHAIN_BIN:-}" ]; then
            export PATH="$TOOLCHAIN_BIN:$PATH"
            echo ">>> 工具链: $(command -v clang)"; clang --version | head -1
          fi
          bash scripts/build.sh 2>&1 | tee build.log
          echo "---- ccache 统计 ----"
          ccache -s || true

      - name: 收集内核 Image
        id: collect_img
        run: |
          set -eux
          IMG="$(find work/out -type f -path '*arch/arm64/boot*' -name Image 2>/dev/null | head -n1)"
          [ -n "$IMG" ] || IMG="$(find work -type f -name Image 2>/dev/null | head -n1)"
          if [ -z "$IMG" ]; then
            echo "[x] 找不到内核 Image, 实际产出:"
            find work -maxdepth 6 \( -name 'Image*' -o -name 'vmlinux*' \) 2>/dev/null | head -40
            exit 1
          fi
          echo ">>> 使用 Image: $IMG"; ls -lh "$IMG"
          HB="$(strings "$IMG" 2>/dev/null | grep -c -i hmbird || true)"
          echo ">>> 风驰(hmbird) 符号命中: $HB"
          mkdir -p dist
          cp "$IMG" "dist/Image-${{ github.event.inputs.device_tag }}"
          echo "img_path=$IMG" >> "$GITHUB_OUTPUT"

      - name: 上传内核 Image (原始产物, 打包失败也不丢)
        uses: actions/upload-artifact@v7
        with:
          name: Image-${{ github.event.inputs.device_tag }}-${{ github.run_number }}
          path: dist/Image-*
          if-no-files-found: error
          retention-days: 30

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -eux
          SUFFIX="${{ github.event.inputs.localversion }}"
          IMG="${{ steps.collect_img.outputs.img_path }}"
          DEV_TAG="${{ github.event.inputs.device_tag }}"
          export DEV_NAME="${{ github.event.inputs.device_name }}"
          export DEV_IDS="${{ github.event.inputs.device_ids }}"
          bash scripts/make_ak3.sh "$IMG" dist "Ace6-GKI-6.6-fengchi-FinaSU-${DEV_TAG}${SUFFIX}.zip" \
            || { echo "!! AK3 打包失败(原始 Image 已另传, 不影响内核产物)"; exit 0; }
          ls -lh dist/

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build.log
            work/out/build-info.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传刷机包
        uses: actions/upload-artifact@v7
        with:
          name: Ace6-GKI-6.6-fengchi-FinaSU-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: ignore
          retention-days: 30
